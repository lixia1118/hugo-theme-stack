<script>
document.addEventListener("DOMContentLoaded", function () {
    // 获取 TOC 目录容器中的所有链接文本
    const tocLinks = document.querySelectorAll('.widget--toc #TableOfContents a');
    
    // 1. 匹配开头如 "1.", "1.1", "1.1.1" 等数字序号
    // 2. 同时也匹配由于数字被移除后残留的开头点号 "." 或空格
    const numberPrefixRegex = /^[\s\.]*(\d+(\.\d+)*\s*|[一二三四五六七八九十]+[、\.]\s*)?[\s\.]*/;

    tocLinks.forEach(link => {
        if (link.textContent) {
            // 清理开头的数字和点号
            let cleanedText = link.textContent.replace(numberPrefixRegex, '').trim();
            link.textContent = cleanedText;
        }
    });
});
</script>
