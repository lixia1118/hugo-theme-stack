name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main  # 如果你的默认分支是 master，请改为 master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true  # 确保拉取子模块主题
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true    # 编译 Stack 主题的 SCSS 必须开启 extended

      - name: Build
        # 如果你的文章在 exampleSite 目录下，请取消下一行的注释并注释掉默认的 hugo 命令
        # run: cd exampleSite && hugo --minify -d ../public
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
